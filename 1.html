<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analog Clock</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(#0a0e2e, #1a1f4d);
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .clock {
      width: 320px;
      height: 320px;
      border: 18px solid #00ccff;
      border-radius: 50%;
      position: relative;
      background: #0a1429;
      box-shadow: 
        0 0 60px #00ccff,
        inset 0 0 40px rgba(0, 204, 255, 0.3);
    }

    /* الأرقام */
    .number {
      position: absolute;
      width: 100%;
      height: 100%;
      text-align: center;
      color: white;
      font-size: 26px;
      font-weight: bold;
      text-shadow: 0 0 10px #00ccff;
    }

    /* العقارب */
    .hand {
      position: absolute;
      left: 50%;
      bottom: 50%;
      transform-origin: bottom center;
      border-radius: 50px;
      transition: transform 0.05s cubic-bezier(0.1, 2.7, 0.58, 1);
    }

    #hour {
      width: 8px;
      height: 82px;
      background: #00ccff;
      margin-left: -4px;
    }

    #minute {
      width: 6px;
      height: 110px;
      background: #ffffff;
      margin-left: -3px;
    }

    #second {
      width: 3px;
      height: 125px;
      background: #ff3366;
      margin-left: -1.5px;
    }

    /* النقطة في الوسط */
    .center-dot {
      position: absolute;
      width: 18px;
      height: 18px;
      background: #00ccff;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 15px #00ccff;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div class="clock">
    <!-- الأرقام -->
    <div class="number" style="transform: rotate(0deg);"><span style="transform: rotate(0deg);">12</span></div>
    <div class="number" style="transform: rotate(30deg);"><span style="transform: rotate(-30deg);">1</span></div>
    <div class="number" style="transform: rotate(60deg);"><span style="transform: rotate(-60deg);">2</span></div>
    <div class="number" style="transform: rotate(90deg);"><span style="transform: rotate(-90deg);">3</span></div>
    <div class="number" style="transform: rotate(120deg);"><span style="transform: rotate(-120deg);">4</span></div>
    <div class="number" style="transform: rotate(150deg);"><span style="transform: rotate(-150deg);">5</span></div>
    <div class="number" style="transform: rotate(180deg);"><span style="transform: rotate(-180deg);">6</span></div>
    <div class="number" style="transform: rotate(210deg);"><span style="transform: rotate(-210deg);">7</span></div>
    <div class="number" style="transform: rotate(240deg);"><span style="transform: rotate(-240deg);">8</span></div>
    <div class="number" style="transform: rotate(270deg);"><span style="transform: rotate(-270deg);">9</span></div>
    <div class="number" style="transform: rotate(300deg);"><span style="transform: rotate(-300deg);">10</span></div>
    <div class="number" style="transform: rotate(330deg);"><span style="transform: rotate(-330deg);">11</span></div>

    <!-- العقارب -->
    <div id="hour" class="hand"></div>
    <div id="minute" class="hand"></div>
    <div id="second" class="hand"></div>

    <!-- النقطة الوسطى -->
    <div class="center-dot"></div>
  </div>

  <script>
    // ==================== JavaScript ====================
    const hourHand   = document.getElementById('hour');
    const minuteHand = document.getElementById('minute');
    const secondHand = document.getElementById('second');

    function runClock() {
      const now = new Date();

      const h = now.getHours() % 12;
      const m = now.getMinutes();
      const s = now.getSeconds();

      // حساب الدرجات
      const hourDeg   = (h * 30) + (m * 0.5);
      const minuteDeg = (m * 6) + (s * 0.1);
      const secondDeg = s * 6;

      // تطبيق الدوران
      hourHand.style.transform   = `translateX(-50%) rotate(${hourDeg}deg)`;
      minuteHand.style.transform = `translateX(-50%) rotate(${minuteDeg}deg)`;
      secondHand.style.transform = `translateX(-50%) rotate(${secondDeg}deg)`;
    }

    // تشغيل الساعة فوراً + كل ثانية
    runClock();
    setInterval(runClock, 1000);
  </script>

</body>
</html>
